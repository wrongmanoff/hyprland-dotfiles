# source = ~/.config/hypr/myColors.conf

source = $HOME/.config/hypr/conifg/monitor.conf #control montior layout and resolution
source = $HOME/.config/hypr/conifg/program.conf
source = ~/.config/hypr/conifg/autostart.conf
source = ~/.config/hypr/conifg/environment.conf
source = ~/.config/hypr/conifg/looks.conf #contains visual settings and themes and wallpapers
source = ~/.config/hypr/conifg/input.conf
source = ~/.config/hypr/conifg/keybindings.conf
source = ~/.config/hypr/conifg/windowsandworkspaces.conf




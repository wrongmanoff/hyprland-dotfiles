
###################
### KEYBINDINGS ###
###################


###################
###    APPS     ###
###################



# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exec, command -v hyprshutdown >/dev/null 2>&1 && hyprshutdown || hyprctl dispatch exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, rofi -show drun -show-icons -no-lazy-grab
bind = $mainMod SHIFT, C, exec, pkill -x rofi
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, layoutmsg, togglesplit # dwindle
bind = $mainMod, L, exec, hyprlock
bind = $mainMod, X, exec, wlogout
bind = $mainMod, F, fullscreen
bind = $mainMod, W, exec, waypaper
bind = $mainMod, N, exec, flatpak run com.vixalien.sticky
bind = $mainMod, D, workspace, 10
bind = $mainMod, K, exec, networkmanager_dmenu
bind = $mainMod, A, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy
#Power Profiles

# Performance Mode (Max power)
bind = SUPER, F1, exec, powerprofilesctl set performance

# Balanced Mode
bind = SUPER, F2, exec, powerprofilesctl set balanced

# Power Saver Mode
bind = SUPER, F3, exec, powerprofilesctl set power-saver

# Area screenshot → copy to clipboard
bind = , PRINT, exec, grim -g "$(slurp)" - | wl-copy && notify-send "Screenshot" "Copied to clipboard"

# Area screenshot → save to Pictures
bind = SHIFT, PRINT, exec, grim -g "$(slurp)" ~/Pictures/Screenshot-$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot" "Saved to Pictures"

# Area screenshot → open in editor
bind = CTRL, PRINT, exec, grim -g "$(slurp)" - | swappy -f -

# Full screen → copy to clipboard
bind = $mainMod, PRINT, exec, grim - | wl-copy && notify-send "Screenshot" "Full screen copied to clipboard"

# Full screen → save
bind = $mainMod SHIFT, PRINT, exec, grim ~/Pictures/Screenshot-$(date +%Y-%m-%d_%H-%M-%S).png && notify-send "Screenshot" "Full screen saved"

# dismiss last notification
bind = $mainMod, BackSpace, exec, makoctl dismiss

# dismiss all notifications
bind = $mainMod SHIFT, BackSpace, exec, makoctl dismiss --all

# Spotify controls
bind = $mainMod, F5, exec, playerctl previous
bind = $mainMod, F6, exec, playerctl play-pause
bind = $mainMod, F7, exec, playerctl next

# Spotify open/focus
bind = $mainMod, F8, exec, spotify --uri=spotify:

# Show current song in notification
bind = $mainMod, F9, exec, notify-send "Now Playing" "$(playerctl metadata title) — $(playerctl metadata artist)"

#lockscree
exec-once = hypridle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && notify-send -t 1500 "Volume" "$(pactl get-sink-volume @DEFAULT_SINK@ | grep -o '[0-9]*%' | head -1)"
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && notify-send -t 1500 "Volume" "$(pactl get-sink-volume @DEFAULT_SINK@ | grep -o '[0-9]*%' | head -1)"
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && notify-send -t 1500 "Volume" "Muted"
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && notify-send -t 1500 "Brightness" "$(brightnessctl get)%"
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && notify-send -t 1500 "Brightness" "$(brightnessctl get)%"

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

#orientation
bind = $mainMod, F12, exec, ~/.config/hypr/scripts/toggle-rotate.sh

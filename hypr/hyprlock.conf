animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1.0
    animation = fade, 1, 5, ease
}

# 🌌 Background (blurred screenshot)
background {
    monitor =
    path = /home/rightman/Downloads/wallpaper.jpg
    blur_passes = 4
    blur_size = 10
    noise = 0.02
    contrast = 0.9
    brightness = 0.8
    vibrancy = 0.2
}

# 🕒 TIME (BIG center clock)
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%H:%M')"
    color = rgba(ffffffee)
    font_size = 80
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# 📅 DATE
label {
    monitor =
    text = cmd[update:1000] echo "$(date +'%A, %d %B')"
    color = rgba(ffffffaa)
    font_size = 22
    font_family = JetBrainsMono Nerd Font
    position = 0, 60
    halign = center
    valign = center
}



# 🔑 PASSWORD FIELD (minimal, hidden feel)
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 2

    outer_color = rgba(255,255,255,0.2)
    inner_color = rgba(0,0,0,0.2)
    font_color = rgba(255,255,255,1)

    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true

    placeholder_text =
    hide_input = false

    fade_on_empty = true
    fade_timeout = 2000
    grab_keyboard = true

    position = 0, -120
    halign = center
    valign = center
}
